name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned devbox environment (NFR21)
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Provision SDKs and dependencies
        run: devbox run -- make deps

      - name: Gradle caches (egress seals' resolved graph + pinned distribution)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Codegen freshness (Drift, localization, and catalogue outputs)
        run: devbox run -- make codegen-check

      - name: Story completion gate (NFR17)
        run: devbox run -- make gate

      - name: Build-time checks
        run: devbox run -- make check
        env:
          CATALOGUE_EVOLUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Core suite (no emulator)
        run: devbox run -- make test-core
