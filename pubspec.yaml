name: organizer
description: Anti-overwhelm mobile task organizer — validation build.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: 3.4.2
  core:
    path: packages/core
  drift: 2.34.3
  drift_flutter: 0.3.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.3
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # gen_l10n: lib/l10n/app_es.arb is the single string table (AD-15);
  # l10n.yaml directs the generated accessors to lib/strings/.
  generate: true

  # The shipped Evergreen catalogue (AD-16): a versioned, read-only JSON
  # asset loaded once by the named shell loader — never written.
  assets:
    - assets/evergreen/

  # Both variable faces bundled (DESIGN.md Typography): Lora 400..700 +
  # italic 400, Lexend 300..700. Sizes in the type roles are sp, weights
  # ride the variable axes.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-VariableFont_wght.ttf
        - asset: assets/fonts/Lora-Italic-VariableFont_wght.ttf
          style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
