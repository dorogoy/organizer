# gen_l10n configuration — the shipped ARB *is* the string table (AD-15).
# lib/l10n/app_es.arb is the single table; lib/strings/ holds only the
# generated accessors, never hand-written constants.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_strings.dart
output-class: AppStrings
output-dir: lib/strings
nullable-getter: false
header: '// Generated by gen_l10n. Do not edit.'
